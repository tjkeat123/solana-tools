services:
  postgres:
    image: postgres:15
    container_name: solana-tools-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solana_tools}
      POSTGRES_USER: ${POSTGRES_USER:-solana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  postgres_data:
